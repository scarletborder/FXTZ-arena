[package]
name = "fxtz-arena-desktop"
version = "0.0.0"
description = "FXTZ Arena desktop client"
authors = ["FXTZ Arena"]
edition = "2021"

[lib]
name = "fxtz_arena_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
