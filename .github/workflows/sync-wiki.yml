name: 同步文档到 Wiki

on:
  push:
    branches:
      - main
    paths:
      - "docs/wiki/**"

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 同步文件夹到 Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIKI_DIR: docs/wiki/
