name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  TAURI_UPDATER_ENDPOINT: ${{ vars.TAURI_UPDATER_ENDPOINT || 'https://github.com/scarletborder/FXTZ-arena/releases/latest/download/latest.json' }}
  TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
  VITE_DESKTOP_UPDATER_ENDPOINT: ${{ vars.VITE_DESKTOP_UPDATER_ENDPOINT || 'https://github.com/scarletborder/FXTZ-arena/releases/latest/download/latest.json' }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      build_label: ${{ steps.meta.outputs.build_label }}
      base: ${{ steps.meta.outputs.base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve build metadata
        id: meta
        env:
          CONFIGURED_APP_BASE: ${{ vars.VITE_APP_BASE }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          APP_VERSION="${TAG_NAME}"
          APP_COMMIT="$(git rev-list --count HEAD)"
          BUILD_LABEL="${APP_VERSION}+${APP_COMMIT}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          APP_BASE="${CONFIGURED_APP_BASE:-./}"

          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${APP_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "build_label=${BUILD_LABEL}" >> "$GITHUB_OUTPUT"
          echo "base=${APP_BASE}" >> "$GITHUB_OUTPUT"
          echo "Building ${REPO_NAME} ${BUILD_LABEL} at base ${APP_BASE}"

      - name: Build frontend and dedicated server
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          APP_COMMIT: ${{ steps.meta.outputs.commit }}
          VITE_APP_VERSION: ${{ steps.meta.outputs.version }}
          VITE_APP_COMMIT: ${{ steps.meta.outputs.commit }}
          VITE_APP_BASE: ${{ steps.meta.outputs.base }}
          VITE_DOCS_URL: "https://mvz443-team.github.io/docs/"
        run: pnpm turbo run build --filter=frontend... --filter=dedicated-server...

      - name: Prepare dedicated server release artifact
        env:
          BUILD_LABEL: ${{ steps.meta.outputs.build_label }}
        run: |
          mkdir -p release/dedicated-server-package
          cp -R apps/dedicated-server/dist release/dedicated-server-package/dist
          cp apps/dedicated-server/scripts/ecosystem.config.cjs release/dedicated-server-package/ecosystem.config.cjs
          cp apps/dedicated-server/README.md release/dedicated-server-package/README.md
          tar -czf "release/fxtz-arena-dedicated-server-${BUILD_LABEL}.tar.gz" -C release/dedicated-server-package .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/frontend/dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FXTZ Arena ${{ steps.meta.outputs.build_label }}
          body: |
            ## 制品说明 Artifact：

            - fxtz-arena-desktop-vx.x.x+xxx.zip : 桌面端应用，一般用户下载此文件即可游玩，Desktop client for Windows, which can be directly run after extraction.
            - fxtz-arena-dedicated-server-image-vx.x.x+xxx.tar.gz : Docker image of the dedicated server, which can be loaded using "docker load" command.
            - fxtz-arena-dedicated-server-vx.x.x+xxx.tar.gz : 独立服务器文件，包含运行独立服务器所需的所有文件和说明文档，适用于需要在本地或云服务器上部署独立服务器的用户。

            ## What's New 新内容: 
            ...

            ## Fix and Modification 修复和调整:
            ...

          files: |
            Release.md
            release/fxtz-arena-frontend-${{ steps.meta.outputs.build_label }}.zip
            release/fxtz-arena-dedicated-server-${{ steps.meta.outputs.build_label }}.tar.gz

  build-desktop:
    needs: [build]
    runs-on: windows-latest
    outputs:
      build_label: ${{ steps.meta.outputs.build_label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve build metadata
        id: meta
        shell: bash # 强制使用 bash 而不是 PowerShell
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          APP_VERSION="${TAG_NAME}"
          APP_COMMIT="$(git rev-list --count HEAD)"
          BUILD_LABEL="${APP_VERSION}+${APP_COMMIT}"

          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${APP_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "build_label=${BUILD_LABEL}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup NSIS
        shell: powershell
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate desktop updater config
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          : "${TAURI_UPDATER_ENDPOINT:?TAURI_UPDATER_ENDPOINT is required}"
          : "${TAURI_UPDATER_PUBKEY:?TAURI_UPDATER_PUBKEY is required}"
          : "${VITE_DESKTOP_UPDATER_ENDPOINT:?VITE_DESKTOP_UPDATER_ENDPOINT is required}"
          : "${TAURI_SIGNING_PRIVATE_KEY:?TAURI_SIGNING_PRIVATE_KEY secret is required}"

      # ================== 替换的部分开始 ==================
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Setup Tauri CLI
        run: cargo binstall tauri-cli --version "^2.0.0" -y
      # ================== 替换的部分结束 ==================

      - name: Build desktop app
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          APP_COMMIT: ${{ steps.meta.outputs.commit }}
          VITE_APP_VERSION: ${{ steps.meta.outputs.version }}
          VITE_APP_COMMIT: ${{ steps.meta.outputs.commit }}
          VITE_DOCS_URL: "https://mvz443-team.github.io/docs/"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BUILD_LABEL: ${{ steps.meta.outputs.build_label }} # 传递 build label 给脚本
        working-directory: apps/desktop
        run: pnpm run publish-desktop

      - name: Prepare release artifacts
        shell: bash
        env:
          BUILD_LABEL: ${{ steps.meta.outputs.build_label }}
        run: |
          mkdir -p release

          # 1. 优先检查是否已存在带版本号的文件
          if [ -f "dist-desktop/fxtz-arena-desktop-${BUILD_LABEL}.zip" ]; then
            cp "dist-desktop/fxtz-arena-desktop-${BUILD_LABEL}.zip" "release/fxtz-arena-desktop-${BUILD_LABEL}.zip"
            echo "Desktop artifact prepared (already versioned): fxtz-arena-desktop-${BUILD_LABEL}.zip"
            
          # 2. 其次检查是否存在未带版本号的文件并进行更名复制
          elif [ -f "dist-desktop/fxtz-arena-desktop.zip" ]; then
            cp "dist-desktop/fxtz-arena-desktop.zip" "release/fxtz-arena-desktop-${BUILD_LABEL}.zip"
            echo "Desktop artifact prepared (renamed): fxtz-arena-desktop-${BUILD_LABEL}.zip"
            
          # 3. 备用兜底：若有其他命名的 zip 文件，直接将其复制并重命名
          else
            ZIP_FILE=$(find dist-desktop -maxdepth 1 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              cp "$ZIP_FILE" "release/fxtz-arena-desktop-${BUILD_LABEL}.zip"
              echo "Desktop artifact prepared (fallback zip found: $ZIP_FILE): fxtz-arena-desktop-${BUILD_LABEL}.zip"
            else
              echo "Error: No desktop zip artifact found in dist-desktop/"
              ls -la dist-desktop/ || echo "dist-desktop directory not found"
              exit 1 # 主动报错，终止后续无意义的发布步骤
            fi
          fi

          APP_VERSION="${GITHUB_REF_NAME#v}"
          INSTALLER_NAME="FXTZ.Arena_${APP_VERSION}_x64-setup.exe"
          if [ ! -f "dist-desktop/${INSTALLER_NAME}" ]; then
            echo "Error: Desktop installer not found: dist-desktop/${INSTALLER_NAME}"
            ls -la dist-desktop/ || echo "dist-desktop directory not found"
            exit 1
          fi
          if [ ! -f "dist-desktop/${INSTALLER_NAME}.sig" ]; then
            echo "Error: Desktop installer signature not found: dist-desktop/${INSTALLER_NAME}.sig"
            ls -la dist-desktop/ || echo "dist-desktop directory not found"
            exit 1
          fi
          if [ ! -f "dist-desktop/latest.json" ]; then
            echo "Error: Desktop updater manifest not found: dist-desktop/latest.json"
            ls -la dist-desktop/ || echo "dist-desktop directory not found"
            exit 1
          fi
          cp "dist-desktop/${INSTALLER_NAME}" "release/${INSTALLER_NAME}"
          cp "dist-desktop/${INSTALLER_NAME}.sig" "release/${INSTALLER_NAME}.sig"
          cp "dist-desktop/latest.json" "release/latest.json"

      - name: Upload desktop artifact to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/*

  build-docker:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release directory
        run: mkdir -p release

      - name: Build Docker image
        env:
          APP_VERSION: ${{ needs.build.outputs.version }}
          APP_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          docker build \
            --build-arg APP_VERSION="${APP_VERSION}" \
            --build-arg APP_COMMIT="${APP_COMMIT}" \
            -t "fxtz-arena-dedicated-server:${APP_VERSION}" \
            .
          docker save "fxtz-arena-dedicated-server:${APP_VERSION}" | gzip > "release/fxtz-arena-dedicated-server-image-${APP_VERSION}+${APP_COMMIT}.tar.gz"

      - name: Add Docker image to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/fxtz-arena-dedicated-server-image-${{ needs.build.outputs.build_label }}.tar.gz

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
