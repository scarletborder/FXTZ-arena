name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  TAURI_UPDATER_ENDPOINT: ${{ vars.TAURI_UPDATER_ENDPOINT || 'https://gh-proxy.org/https://github.com/scarletborder/FXTZ-arena/releases/latest/download/latest.json' }}
  TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY || 'dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IENENTFBQUIyNzA1ODZEMzkKUldRNWJWaHdzcXBSemZzS3AyOHJPUXhEcmtSc21GcFBhSHdpYmJTNHF3VDJvUGlpcW14OGFhbzAK' }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      build_label: ${{ steps.meta.outputs.build_label }}
      base: ${{ steps.meta.outputs.base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve build metadata
        id: meta
        env:
          CONFIGURED_APP_BASE: ${{ vars.VITE_APP_BASE }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          APP_VERSION="${TAG_NAME}"
          APP_COMMIT="$(git rev-list --count HEAD)"
          BUILD_LABEL="${APP_VERSION}+${APP_COMMIT}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          APP_BASE="${CONFIGURED_APP_BASE:-./}"

          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${APP_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "build_label=${BUILD_LABEL}" >> "$GITHUB_OUTPUT"
          echo "base=${APP_BASE}" >> "$GITHUB_OUTPUT"
          echo "Building ${REPO_NAME} ${BUILD_LABEL} at base ${APP_BASE}"

      - name: Build frontend and dedicated server
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          APP_COMMIT: ${{ steps.meta.outputs.commit }}
          VITE_APP_VERSION: ${{ steps.meta.outputs.version }}
          VITE_APP_COMMIT: ${{ steps.meta.outputs.commit }}
          VITE_APP_BASE: ${{ steps.meta.outputs.base }}
          VITE_DOCS_URL: "https://mvz443-team.github.io/docs/"
        run: pnpm turbo run build --filter=frontend... --filter=dedicated-server...

      - name: Prepare dedicated server release artifact
        env:
          BUILD_LABEL: ${{ steps.meta.outputs.build_label }}
        run: |
          mkdir -p release/dedicated-server-package
          cp -R apps/dedicated-server/dist release/dedicated-server-package/dist
          cp apps/dedicated-server/scripts/ecosystem.config.cjs release/dedicated-server-package/ecosystem.config.cjs
          cp apps/dedicated-server/README.md release/dedicated-server-package/README.md
          tar -czf "release/fxtz-arena-dedicated-server-${BUILD_LABEL}.tar.gz" -C release/dedicated-server-package .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/frontend/dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FXTZ Arena ${{ steps.meta.outputs.build_label }}
          body: |
            ...

          files: |
            release/fxtz-arena-frontend-${{ steps.meta.outputs.build_label }}.zip
            release/fxtz-arena-dedicated-server-${{ steps.meta.outputs.build_label }}.tar.gz

  build-desktop:
    needs: [build]
    runs-on: windows-latest
    outputs:
      build_label: ${{ steps.meta.outputs.build_label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve build metadata
        id: meta
        shell: bash # 强制使用 bash 而不是 PowerShell
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          APP_VERSION="${TAG_NAME#v}"
          APP_COMMIT="$(git rev-list --count HEAD)"
          BUILD_LABEL="${TAG_NAME}+${APP_COMMIT}"

          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${APP_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "build_label=${BUILD_LABEL}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup NSIS
        shell: powershell
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate desktop updater config
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          : "${TAURI_UPDATER_ENDPOINT:?TAURI_UPDATER_ENDPOINT is required}"
          : "${TAURI_UPDATER_PUBKEY:?TAURI_UPDATER_PUBKEY is required}"
          : "${TAURI_SIGNING_PRIVATE_KEY:?TAURI_SIGNING_PRIVATE_KEY secret is required}"

      - name: Build desktop frontend
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          APP_COMMIT: ${{ steps.meta.outputs.commit }}
          VITE_APP_VERSION: ${{ steps.meta.outputs.version }}
          VITE_APP_COMMIT: ${{ steps.meta.outputs.commit }}
          VITE_APP_TARGET: desktop
          VITE_DOCS_URL: "https://mvz443-team.github.io/docs/"
        working-directory: apps/desktop
        run: node ./scripts/build-frontend.mjs

      # ==========================================================
      # 1. 移动资源包至 desktop 目录，使其不被打包进二进制内
      # ==========================================================
      - name: Prepare external resources
        shell: bash
        run: |
          mkdir -p apps/desktop/resource-assets
          if [ -d "apps/frontend/dist/resource-assets" ]; then
            mv apps/frontend/dist/resource-assets/* apps/desktop/resource-assets/
            rm -rf apps/frontend/dist/resource-assets
            echo "资源已移至桌面端外置目录。"
          fi

      # ==========================================================
      # 2. 修改 tauri-action 参数，让安装包包含外部资源目录
      # ==========================================================
      - name: Build and upload Tauri updater bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: FXTZ Arena ${{ steps.meta.outputs.build_label }}
          releaseBody: |
            ## 制品说明 Artifact:
            - fxtz-arena-dedicated-server-image-vx.x.x+xxx.tar.gz : Docker image of the dedicated server, which can be loaded using "docker load" command. 专用服务端镜像，一般用户无需下载
            - fxtz-arena-dedicated-server-vx.x.x+xxx.tar.gz : 专用服务器文件，包含运行专用服务器所需的所有文件和说明文档，适用于需要在本地或云服务器上部署专用服务器的用户。一般用户无需下载
            - fxtz-arena-desktop-portable-vx.x.x+xxx.zip : 免安装桌面端应用和附带文档，一般用户下载此文件解压后即可游玩，Desktop client for Windows, which can be directly run after extraction.
            - fxtz-arena-desktop-vx.x.x+xxx.exe : 免安装桌面端应用，无附带文档，一般用户下载此文件即可游玩
            - FXTZ.Arena_x.x.x_x64-setup.exe: 桌面端应用安装包

            ## What's New 新内容:
            ...

            ## Fix and Modification 修复和调整:
            ...

          releaseDraft: false
          prerelease: false
          # 增加 "resources": ["../resource-assets/**/*"] 参数
          args: --config '{"version":"${{ steps.meta.outputs.version }}","bundle":{"createUpdaterArtifacts":true,"targets":["nsis"],"resources":["../resource-assets/**/*"]},"plugins":{"updater":{"endpoints":["${{ env.TAURI_UPDATER_ENDPOINT }}"],"pubkey":"${{ env.TAURI_UPDATER_PUBKEY }}"}}}'

      - name: Fix Tauri updater URLs in latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node -e '
          const fs = require("fs");
          const { execSync } = require("child_process");

          const tagName = process.env.TAG_NAME;
          const repo = process.env.GITHUB_REPOSITORY;

          console.log("正在从 Release 下载自动生成的 latest.json...");
          execSync(`gh release download "${tagName}" --pattern "latest.json" --clobber`, { stdio: "inherit" });

          console.log("正在查询当前 Release 的全部资产信息...");
          const releaseInfoStr = execSync(`gh api repos/${repo}/releases/tags/${tagName}`).toString();
          const releaseInfo = JSON.parse(releaseInfoStr);

          // 建立 ID 与浏览器直链的映射
          const assetMap = {};
          releaseInfo.assets.forEach(asset => {
            assetMap[asset.id.toString()] = asset.browser_download_url;
          });

          const latestJson = JSON.parse(fs.readFileSync("latest.json", "utf8"));
          let modified = false;

          for (const platform in latestJson.platforms) {
            const platformData = latestJson.platforms[platform];
            const url = platformData.url;
            
            // 使用 [0-9]+ 匹配资产 ID，避免 Bash 下反斜杠特殊字符逃逸
            const match = url.match(/\/releases\/assets\/([0-9]+)/);
            if (match) {
              const assetId = match[1];
              const directUrl = assetMap[assetId];
              if (directUrl) {
                // 拼接上你配置的国内代理 gh-proxy.org 保证下载速度
                const proxiedUrl = `https://gh-proxy.org/${directUrl}`;
                platformData.url = proxiedUrl;
                modified = true;
                console.log(`已成功替换 [${platform}] 地址为: ${proxiedUrl}`);
              } else {
                console.warn(`未能在 Release 中找到 ID 为 ${assetId} 的资产`);
              }
            }
          }

          if (modified) {
            // 写回本地并覆盖上传
            fs.writeFileSync("latest.json", JSON.stringify(latestJson, null, 2));
            console.log("正在将修改后的 latest.json 覆盖上传到 GitHub Release...");
            execSync(`gh release upload "${tagName}" latest.json --clobber`, { stdio: "inherit" });
            console.log("覆盖上传成功！");
          } else {
            console.log("最新版本最新链接无需修改或无更改。");
          }
          '

      - name: Build portable desktop artifacts
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          APP_COMMIT: ${{ steps.meta.outputs.commit }}
          VITE_APP_VERSION: ${{ steps.meta.outputs.version }}
          VITE_APP_COMMIT: ${{ steps.meta.outputs.commit }}
          VITE_APP_TARGET: desktop
          VITE_DOCS_URL: "https://mvz443-team.github.io/docs/"
          BUILD_LABEL: ${{ steps.meta.outputs.build_label }}
        working-directory: apps/desktop
        run: pnpm run publish-portable

      - name: Prepare release artifacts
        shell: bash
        env:
          BUILD_LABEL: ${{ steps.meta.outputs.build_label }}
        run: |
          mkdir -p release
          test -f "release/fxtz-arena-desktop-portable-${BUILD_LABEL}.zip"
          test -f "release/fxtz-arena-desktop-${BUILD_LABEL}.exe"

      - name: Upload desktop artifact to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/*

  build-docker:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release directory
        run: mkdir -p release

      - name: Build Docker image
        env:
          APP_VERSION: ${{ needs.build.outputs.version }}
          APP_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          docker build \
            --build-arg APP_VERSION="${APP_VERSION}" \
            --build-arg APP_COMMIT="${APP_COMMIT}" \
            -t "fxtz-arena-dedicated-server:${APP_VERSION}" \
            .
          docker save "fxtz-arena-dedicated-server:${APP_VERSION}" | gzip > "release/fxtz-arena-dedicated-server-image-${APP_VERSION}+${APP_COMMIT}.tar.gz"

      - name: Add Docker image to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/fxtz-arena-dedicated-server-image-${{ needs.build.outputs.build_label }}.tar.gz

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
