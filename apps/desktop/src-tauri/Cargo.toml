[package]
name = "fxtz-arena-desktop"
version = "0.0.0"
description = "FXTZ Arena desktop client"
authors = ["FXTZ Arena"]
edition = "2021"

[lib]
name = "fxtz_arena_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-log = "2.8.0"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["rt", "macros", "io-util", "sync", "time"] }
url = "2"
wtransport = { version = "0.7", features = ["dangerous-configuration"] }
